name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.25.14"

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -s -l $(find . -name '*.go' -not -path './vendor/*'))"

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@v0.30.0

      - name: Check imports
        run: test -z "$(goimports -l $(find . -name '*.go' -not -path './vendor/*'))"

      - name: Run linter
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --timeout=5m

      - name: Run tests
        run: go test -race ./...

      - name: Build binary
        run: CGO_ENABLED=0 go build ./cmd/maigo
