openapi: 3.1.0
info:
  title: Maigo Core API
  version: 1.0.0
  description: A small self-hosted URL shortener with SQLite persistence.
servers:
  - url: http://127.0.0.1:8080
    description: Local development
tags:
  - name: Health
  - name: URLs
security:
  - bearerAuth: []
  - apiKey: []
paths:
  /health:
    get:
      tags: [Health]
      security: []
      operationId: health
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      tags: [Health]
      security: []
      operationId: readiness
      responses:
        '200':
          description: Process and SQLite database are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/urls:
    post:
      tags: [URLs]
      operationId: createURL
      summary: Create a short link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateURLRequest'
      responses:
        '201':
          description: Link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/URL'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [URLs]
      operationId: listURLs
      summary: List all links
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/URLList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/urls/{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      tags: [URLs]
      security: []
      operationId: getURL
      summary: Inspect a short link
      responses:
        '200':
          description: Link metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/URL'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [URLs]
      operationId: deleteURL
      summary: Delete a short link
      responses:
        '200':
          description: Link deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/urls/{code}/stats:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      tags: [URLs]
      operationId: getURLStats
      summary: Read lifetime hit count
      responses:
        '200':
          description: Lifetime statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/URLStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      tags: [URLs]
      security: []
      operationId: redirectURL
      summary: Redirect to the target URL
      responses:
        '302':
          description: Redirect
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Link has expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The configured Maigo API key as a bearer token.
    apiKey:
      type: apiKey
      in: header
      name: X-Maigo-API-Key
  parameters:
    Code:
      name: code
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 50
        pattern: '^[0-9A-Za-z]+$'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Alias already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Link or route not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: SQLite is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CreateURLRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: HTTP or HTTPS target URL.
        custom:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[0-9A-Za-z]+$'
        ttl:
          type: integer
          format: int64
          minimum: 60
          description: Lifetime in seconds; mutually exclusive with expires_at.
        expires_at:
          type: string
          format: date-time
          description: Future RFC3339 expiry; mutually exclusive with ttl.
    URL:
      type: object
      required: [id, short_code, url, target_url, short_url, created_at, hits]
      properties:
        id:
          type: integer
          format: int64
        short_code:
          type: string
        url:
          type: string
          format: uri
        target_url:
          type: string
          format: uri
        short_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        expired:
          type: boolean
        hits:
          type: integer
          format: int64
    URLStats:
      type: object
      required: [id, short_code, url, short_url, created_at, hits]
      properties:
        id:
          type: integer
          format: int64
        short_code:
          type: string
        url:
          type: string
          format: uri
        short_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        hits:
          type: integer
          format: int64
    URLList:
      type: object
      required: [urls, pagination]
      properties:
        urls:
          type: array
          items:
            $ref: '#/components/schemas/URLListItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
    URLListItem:
      type: object
      required: [id, short_code, target_url, created_at, hits]
      properties:
        id:
          type: integer
          format: int64
        short_code:
          type: string
        target_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        hits:
          type: integer
          format: int64
    Pagination:
      type: object
      required: [page, page_size, total, pages]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64
        pages:
          type: integer
    Health:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: maigo
    Readiness:
      type: object
      required: [status, service, database]
      properties:
        status:
          type: string
          example: ready
        service:
          type: string
          example: maigo
        database:
          type: string
          example: healthy
    Success:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        details:
          nullable: true
