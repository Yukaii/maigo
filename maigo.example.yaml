# Maigo URL Shortener Configuration

# Database Configuration (12-Factor App Style)
# Option 1: Use DATABASE_URL (recommended for production)
# database:
#   url: postgres://username:password@host:port/dbname?sslmode=require

# Option 2: Individual parameters (development)
database:
  # url: "" # Set DATABASE_URL environment variable instead
  host: localhost
  port: 5432
  name: maigo
  user: postgres
  password: password
  ssl_mode: disable
  max_conns: 10
  max_idle: 5

# HTTP Server Configuration
server:
  port: 8080
  host: 127.0.0.1
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

# OAuth2 Configuration
oauth2:
  client_id: maigo-cli
  client_secret: cli-client-secret-not-used-with-pkce
  redirect_uri: http://localhost:8000/callback

# JWT Configuration
jwt:
  secret: dev_jwt_secret_change_in_production
  expiration: 24h

# Application Configuration
app:
  base_domain: maigo.dev
  tls: false
  short_code_length: 6
  debug: true
  cors_enabled: true
  rate_limit:
    requests: 100
    window: 1h

# Logging Configuration
log:
  level: debug
  format: text
