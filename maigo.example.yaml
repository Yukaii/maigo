# Maigo Core configuration. Environment variables are usually simpler for a
# container deployment; this file is useful for a local binary installation.

database:
  path: data/maigo.db

server:
  host: 127.0.0.1
  port: 8080
  read_timeout_seconds: 30
  write_timeout_seconds: 30
  idle_timeout_seconds: 120

auth:
  # Use a random value of at least 32 bytes in production.
  api_key: dev_maigo_api_key_change_me

app:
  environment: development
  public_url: http://127.0.0.1:8080
  short_code_length: 6
  debug: false

log:
  level: info
  format: text
